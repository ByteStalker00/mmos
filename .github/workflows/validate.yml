name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sintassi di mmos.js
        run: node --check mmos.js

      - name: Coerenza pagine (CSS/JS esterno, meta, risorse)
        run: node scripts/validate.js
